[package]
name = "kadex-platform-win"
version = "0.1.2"
edition = "2021"
authors = ["Ignatius Karel"]
description = "Pure Win32 + MSFTEDIT_CLASS (RichEdit) + GDI + DWM frontend for Kadex"
license = "MIT"

[dependencies]
kadex-core = { path = "../core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
